name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check plugin scripts
        run: |
          node --check picker.js
          node --check open-picker.js
      - name: Validate plugin manifest
        run: node scripts/validate-manifest.mjs
